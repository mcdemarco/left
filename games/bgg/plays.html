<html>
  <head>
    <title>Sort Plays</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <!--
	Based on a BoardGameGeek geeklist sorter by fiddly_bits.
      -->
    <link href="sort.css" rel="stylesheet" />
    <script type="text/javascript" src="sort.js"></script>
  </head>
  <body class="plays">
    <h1>Play Sorter</h1>

    <form>
      <p class="unwrap">
	<span>Sort plays for user <input type="text" placeholder="username or URL" id="sorteeIds" value="" /></span>
	<span>in order by 
	  <select id="sortBy">
	    <option value="alpha">Alphabetical</option>
	    <option value="date" selected>Date</option>
	    <option value="location">Location</option>
	    <option value="plays">Plays</option>
	  </select>
	</span>
	<span>
	  <span>
	    <input type="checkbox" id="ascending" /> ascending
	  </span>
	  <span style="display:none;">
	    <input type="checkbox" id="images" title="show image" /> image
	  </span>
	  <span>
	    <input type="checkbox" id="comment" title="show my comments" checked /> comment
	  </span>
	</span>
	<span>
	  <input type="submit" value="Sort" />
	  <input type="hidden" id="listtype" name="listtype" value="plays" />
	  <input type="hidden" id="parsedids" name="parsedids" value="" />
	  <input type="hidden" id="updated" name="updated" value="" />
	  <button type="button" id="next">Next 100</button>
	</span>
      </p>
    </form>

    <p class="info">You can pass the username in with the URL, e.g., <a href="./?fiddly_bits" id="urlHint"></a>.</p>
    <p class="info" id="thingURLWrapper" style="display:none;">You can pass these games to the thing sorter with the URL <a id="thingURL" href="#"></a></p>

    <div id="main_content">
      <div id="plays">
      </div>
    </div>

    <p class="info"></p>

    <hr />

    <cite id="footer">
      By mcd (<a href="http://boardgamegeek.com/user/fiddly_bits">fiddly_bits</a>) | <a href="./">about</a><br>
      <img alt="Powered by BoardGameGeek logo" src="powered.png">
    </cite>
  </body>
</html>
