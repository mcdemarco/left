<!DOCTYPE html>
<html>
  <head>
    <title>Sort Hot Games</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <!--
	Based on a BoardGameGeek geeklist sorter by fiddly_bits.
      -->
    <link href="sort.css" rel="stylesheet" />
    <script type="text/javascript" src="sort.js"></script>
  </head>
  <body class="hot">
    <h1>Hot Game Sorter</h1>

    <form>
      <p class="unwrap">
	<span>Sort hot games <input type="hidden" id="sorteeIds" value="boardgame" /></span>
	<span>in order by 
	  <select id="sortBy">
	    <option value="alpha">Alphabetical</option>
	    <option value="rank" selected>Hotness</option>
	    <option value="year">Year Published</option>
	  </select>
	</span>
	<span>
	  <span>
	    <input type="checkbox" id="ascending" checked /> ascending
	  </span>
	  <span>
	    <input type="checkbox" id="images" title="show image" /> image
	  </span>
	</span>
	<input type="hidden" id="listtype" name="listtype" value="hot" />
	<input type="hidden" id="parsedids" name="parsedids" value="" />
	<input type="hidden" id="updated" name="updated" value="" />
      </p>
    </form>

    <p style="display:none;" class="info">You can pass the type in with the URL, e.g., <a href="./?fiddly_bits" id="urlHint"></a>.</p>
    <p class="info" id="thingURLWrapper" style="display:none;">You can pass these games to the thing sorter with the URL <a id="thingURL" href="#"></a></p>

    <div id="main_content">
      <div id="hot">
      </div>
    </div>

    <p class="info"></p>

    <hr />

    <cite id="footer">
      By mcd (<a href="http://boardgamegeek.com/user/fiddly_bits">fiddly_bits</a>) | <a href="./">about</a><br>
      <img alt="Powered by BoardGameGeek logo" src="powered.png">
    </cite>
  </body>
</html>
